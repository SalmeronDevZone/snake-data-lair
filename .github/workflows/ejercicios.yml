name: ejercicios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Soluciones SQL
        run: python ejercicios/sql/comprobar.py --soluciones

  pandas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ejercicios/pandas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas>=2.2"
      - name: Soluciones pandas
        run: python -m unittest -v
        env:
          SOLUCIONES: "1"

  python-sql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ejercicios/python_sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Soluciones Python + SQL
        run: python -m unittest -v
        env:
          SOLUCIONES: "1"
